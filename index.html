<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SAP 피벗 테이블 생성기</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.3.0/exceljs.min.js"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Segoe UI','Malgun Gothic',sans-serif; background:#f0f4f8; min-height:100vh; padding:32px 16px; color:#1a2332; }
.container { max-width:1100px; margin:0 auto; }
header { margin-bottom:28px; }
header h1 { font-size:22px; font-weight:700; }
header p  { margin-top:6px; font-size:13px; color:#6b7a8d; }

.card { background:#fff; border-radius:14px; border:1px solid #e2e8f0; padding:24px; margin-bottom:16px; box-shadow:0 1px 4px rgba(0,0,0,.04); }
.card-title { font-size:11px; font-weight:700; color:#6b7a8d; text-transform:uppercase; letter-spacing:.7px; margin-bottom:14px; }

.drop-zone { border:1.5px dashed #c5d0de; border-radius:10px; padding:48px 20px; text-align:center; cursor:pointer; transition:.2s; background:#fafbfc; }
.drop-zone:hover,.drop-zone.drag-over { border-color:#3b7bde; background:#f0f5ff; }
.drop-zone .icon { font-size:40px; margin-bottom:12px; }
.drop-zone p.main { font-size:15px; font-weight:600; color:#2d3748; margin-bottom:4px; }
.drop-zone p.sub  { font-size:12px; color:#9aa5b4; }

.btn { display:inline-flex; align-items:center; gap:6px; padding:9px 20px; border-radius:8px; font-size:13px; font-weight:600; cursor:pointer; border:none; transition:.15s; }
.btn-secondary { background:#f0f4f8; color:#3b7bde; border:1px solid #c5d0de; }
.btn-secondary:hover { background:#e2eaf4; }

.result-header { display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; flex-wrap:wrap; gap:8px; }
.file-badge { display:inline-flex; align-items:center; gap:6px; font-size:12px; font-weight:600; color:#2d7a4f; background:#e8f5ee; border-radius:20px; padding:4px 12px; }
.stat-badge { font-size:12px; color:#6b7a8d; }

.table-wrap { overflow-x:auto; }
table { width:100%; border-collapse:collapse; font-size:13px; }
table thead th { background:#1a3a6b; color:#fff; padding:10px 14px; text-align:center; font-weight:700; white-space:nowrap; border:1px solid #15305a; }
table thead th.left { text-align:left; }

tr.part-row td     { background:#2E5EA8; color:#fff; font-weight:700; padding:9px 14px; border:1px solid #2151a1; }
tr.supplier-row td { background:#fff; padding:7px 14px; border:1px solid #dde3ec; text-align:right; color:#1a2332; }
tr.supplier-row:nth-child(even) td { background:#f7f9fc; }
tr.supplier-row:hover td { background:#edf2fb; }
tr.grand-row td    { background:#1a3a6b; color:#fff; font-weight:700; padding:9px 14px; border:1px solid #15305a; text-align:right; }

td.label { text-align:left !important; }
td.part-label { text-align:left !important; font-size:13px; }
td.indent { padding-left:20px !important; }
td.dash { color:#ccd4e0; }

.hidden { display:none !important; }
</style>
</head>
<body>
<div class="container">

  <header>
    <h1>🏭 SAP 피벗 테이블 생성기</h1>
    <p>SAP 출력물(.xls)을 올리면 부품번호 · 공장 · 공급업체 · 연도별 수량 합계를 자동으로 만들어줍니다.</p>
  </header>

  <div class="card">
    <div class="card-title">파일 업로드</div>
    <div class="drop-zone" id="dropZone" onclick="document.getElementById('fileInput').click()">
      <div class="icon">📂</div>
      <p class="main">SAP 출력물 파일을 드래그하거나 클릭해서 업로드</p>
      <p class="sub">SAP에서 내보낸 .xls 파일 지원 · 열 선택 불필요, 자동 인식</p>
      <input type="file" id="fileInput" accept=".xlsx,.xls" style="display:none">
    </div>
  </div>

  <div class="card hidden" id="resultCard">
    <div class="result-header">
      <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;">
        <span class="file-badge" id="fileBadge"></span>
        <span class="stat-badge" id="statBadge"></span>
      </div>
      <button class="btn btn-secondary" onclick="exportExcel()">⬇ 엑셀로 저장</button>
    </div>
    <div class="table-wrap">
      <table id="pivotTable"></table>
    </div>
  </div>

</div>
<script>
let rawBuffer = null;
let pivotCache = null;
let sapRecords = null;

const dz = document.getElementById('dropZone');
dz.addEventListener('dragover', e => { e.preventDefault(); dz.classList.add('drag-over'); });
dz.addEventListener('dragleave', () => dz.classList.remove('drag-over'));
dz.addEventListener('drop', e => { e.preventDefault(); dz.classList.remove('drag-over'); loadFile(e.dataTransfer.files[0]); });
document.getElementById('fileInput').addEventListener('change', e => loadFile(e.target.files[0]));

function loadFile(file) {
  if (!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    rawBuffer = e.target.result;
    document.getElementById('fileBadge').textContent = '✓ ' + file.name;
    buildPivot();
  };
  reader.readAsArrayBuffer(file);
}

function parseFile() {
  const bytes = new Uint8Array(rawBuffer);
  // UTF-16 BOM 확인
  const isUtf16 = bytes[0] === 0xFF && bytes[1] === 0xFE;
  const decoder = new TextDecoder(isUtf16 ? 'utf-16' : 'utf-8');
  const text = decoder.decode(bytes);
  const lines = text.split('\n');

  let currentPart = null;
  const records = [];

  for (const line of lines) {
    const cols = line.replace(/\r$/, '').split('\t');
    if (cols.length < 2) continue;
    const val = cols[1].trim();

    // 부품번호 헤더 행 감지
    if (val && val.length > 5 && val.includes('-') && /^\d/.test(val) && !cols[7]?.trim()) {
      currentPart = val;
      continue;
    }

    // 데이터 행
    if (currentPart && cols.length > 17) {
      const sloc     = cols[1].trim();
      const date     = cols[7].trim();
      const qtyRaw   = cols[8].trim().replace(/,/g, '');
      const supplier = cols[17].trim();
      if (sloc && date && qtyRaw && /^\d/.test(sloc)) {
        const qty = parseFloat(qtyRaw);
        const yr  = date.slice(0, 4);
        if (!isNaN(qty) && /^\d{4}$/.test(yr)) {
          records.push({ part: currentPart, sloc, supplier, yr, qty });
        }
      }
    }
  }
  return records;
}

function buildPivot() {
  const records = parseFile();
  sapRecords = records;

  const pivot = {};
  const parts = new Set(), years = new Set();
  const partCombos = {};
  let grandSum = 0;

  for (const r of records) {
    const key = `${r.part}|${r.sloc}|${r.supplier}|${r.yr}`;
    pivot[key] = (pivot[key] || 0) + r.qty;
    parts.add(r.part);
    years.add(r.yr);
    if (!partCombos[r.part]) partCombos[r.part] = new Set();
    partCombos[r.part].add(`${r.sloc}|${r.supplier}`);
    grandSum += r.qty;
  }

  const partArr = [...parts].sort();
  const yearArr = [...years].sort();
  pivotCache = { pivot, partArr, yearArr, partCombos, grandSum };

  const tbl = document.getElementById('pivotTable');
  let html = '<thead><tr>';
  html += '<th class="left">부품번호</th><th class="left">공장</th><th class="left">공급업체</th>';
  yearArr.forEach(y => html += `<th>${y}</th>`);
  html += '<th>합계</th></tr></thead><tbody>';

  for (const part of partArr) {
    const combos = [...partCombos[part]].sort();

    // 부품 소계
    let partTotal = 0;
    const pyt = {};
    for (const yr of yearArr) {
      let s = 0;
      for (const combo of combos) {
        const [sl, su] = combo.split('|');
        s += pivot[`${part}|${sl}|${su}|${yr}`] || 0;
      }
      pyt[yr] = s; partTotal += s;
    }

    html += `<tr class="part-row">`;
    html += `<td class="part-label" colspan="3">📦 ${part}</td>`;
    yearArr.forEach(y => html += pyt[y] ? `<td style="text-align:right;">${pyt[y].toLocaleString('ko-KR')}</td>` : `<td class="dash" style="text-align:right;">-</td>`);
    html += `<td style="text-align:right;">${partTotal.toLocaleString('ko-KR')}</td></tr>`;

    // 공급업체별 행
    for (const combo of combos) {
      const [sloc, sup] = combo.split('|');
      let rowTotal = 0;
      html += `<tr class="supplier-row"><td class="label indent"></td><td class="label indent">${sloc}</td><td class="label">${sup}</td>`;
      yearArr.forEach(y => {
        const v = pivot[`${part}|${sloc}|${sup}|${y}`] || 0;
        rowTotal += v;
        html += v ? `<td>${v.toLocaleString('ko-KR')}</td>` : `<td class="dash">-</td>`;
      });
      html += `<td><b>${rowTotal.toLocaleString('ko-KR')}</b></td></tr>`;
    }
  }

  // 전체 합계
  html += `<tr class="grand-row"><td class="label" colspan="3">전체 합계</td>`;
  yearArr.forEach(y => {
    const s = records.filter(r => r.yr === y).reduce((a, r) => a + r.qty, 0);
    html += `<td>${s.toLocaleString('ko-KR')}</td>`;
  });
  html += `<td>${grandSum.toLocaleString('ko-KR')}</td></tr>`;
  html += '</tbody>';
  tbl.innerHTML = html;

  const partCount = partArr.length;
  const supplierCount = new Set(records.map(r => r.supplier)).size;
  document.getElementById('statBadge').textContent =
    `부품 ${partCount}개 · 공급업체 ${supplierCount}개 · 연도 ${yearArr.length}개 · ${records.length.toLocaleString()}행 처리`;
  document.getElementById('resultCard').classList.remove('hidden');
}

async function exportExcel() {
  if (!pivotCache) return;
  const { pivot, partArr, yearArr, partCombos, grandSum } = pivotCache;
  const records = sapRecords;

  const wb = new ExcelJS.Workbook();
  const ws = wb.addWorksheet('피벗테이블');

  ws.getColumn(1).width = 18;
  ws.getColumn(2).width = 10;
  ws.getColumn(3).width = 12;
  yearArr.forEach((_, i) => ws.getColumn(i + 4).width = 12);
  ws.getColumn(yearArr.length + 4).width = 14;

  const numFmt = '#,##0';
  const darkBlue  = { type:'pattern', pattern:'solid', fgColor:{ argb:'FF1A3A6B' } };
  const midBlue   = { type:'pattern', pattern:'solid', fgColor:{ argb:'FF2E5EA8' } };
  const white     = { type:'pattern', pattern:'solid', fgColor:{ argb:'FFFFFFFF' } };
  const altGray   = { type:'pattern', pattern:'solid', fgColor:{ argb:'FFF7F9FC' } };
  const bdr = { top:{style:'thin',color:{argb:'FFB8C8DF'}}, left:{style:'thin',color:{argb:'FFB8C8DF'}}, bottom:{style:'thin',color:{argb:'FFB8C8DF'}}, right:{style:'thin',color:{argb:'FFB8C8DF'}} };
  const blueBdr = { top:{style:'thin',color:{argb:'FF2151A1'}}, left:{style:'thin',color:{argb:'FF2151A1'}}, bottom:{style:'thin',color:{argb:'FF2151A1'}}, right:{style:'thin',color:{argb:'FF2151A1'}} };

  // 헤더 행
  const hRow = ws.addRow(['부품번호', '공장', '공급업체', ...yearArr, '합계']);
  hRow.eachCell(c => {
    c.fill = darkBlue; c.font = { bold:true, color:{argb:'FFFFFFFF'}, size:11 };
    c.alignment = { horizontal:'center', vertical:'middle' }; c.border = blueBdr;
  });
  hRow.getCell(1).alignment = { horizontal:'left', vertical:'middle' };
  hRow.getCell(2).alignment = { horizontal:'left', vertical:'middle' };
  hRow.getCell(3).alignment = { horizontal:'left', vertical:'middle' };

  for (const part of partArr) {
    const combos = [...partCombos[part]].sort();
    let partTotal = 0;
    const pyt = {};
    for (const yr of yearArr) {
      let s = 0;
      for (const combo of combos) {
        const [sl, su] = combo.split('|');
        s += pivot[`${part}|${sl}|${su}|${yr}`] || 0;
      }
      pyt[yr] = s; partTotal += s;
    }

    // 부품 소계 행
    const pRow = ws.addRow([`📦 ${part}`, '', '', ...yearArr.map(y => pyt[y] || null), partTotal]);
    ws.mergeCells(pRow.number, 1, pRow.number, 3);
    pRow.eachCell({ includeEmpty:true }, (c, cn) => {
      c.fill = midBlue; c.font = { bold:true, color:{argb:'FFFFFFFF'}, size:11 };
      c.border = blueBdr;
      c.alignment = { horizontal: cn <= 3 ? 'left' : 'right', vertical:'middle' };
      if (cn > 3 && c.value) c.numFmt = numFmt;
    });

    // 공급업체별 행
    combos.forEach((combo, ci) => {
      const [sloc, sup] = combo.split('|');
      let rowTotal = 0;
      const rowData = ['', sloc, sup];
      yearArr.forEach(y => { const v = pivot[`${part}|${sloc}|${sup}|${y}`] || 0; rowData.push(v || null); rowTotal += v; });
      rowData.push(rowTotal);
      const r = ws.addRow(rowData);
      r.eachCell({ includeEmpty:true }, (c, cn) => {
        c.fill = ci % 2 === 0 ? white : altGray; c.border = bdr;
        c.alignment = { horizontal: cn <= 3 ? 'left' : 'right', vertical:'middle' };
        if (cn > 3 && c.value) c.numFmt = numFmt;
        if (cn === yearArr.length + 4) c.font = { bold:true };
      });
      r.getCell(2).alignment = { horizontal:'left', vertical:'middle' };
      r.getCell(3).alignment = { horizontal:'left', vertical:'middle' };
    });
  }

  // 전체 합계 행
  const gRow = ws.addRow(['전체 합계', '', '', ...yearArr.map(y => records.filter(r => r.yr === y).reduce((a, r) => a + r.qty, 0)), grandSum]);
  ws.mergeCells(gRow.number, 1, gRow.number, 3);
  gRow.eachCell({ includeEmpty:true }, (c, cn) => {
    c.fill = darkBlue; c.font = { bold:true, color:{argb:'FFFFFFFF'}, size:11 };
    c.border = blueBdr;
    c.alignment = { horizontal: cn <= 3 ? 'left' : 'right', vertical:'middle' };
    if (cn > 3 && c.value) c.numFmt = numFmt;
  });

  const buffer = await wb.xlsx.writeBuffer();
  const blob = new Blob([buffer], { type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'SAP_피벗테이블.xlsx'; a.click();
  URL.revokeObjectURL(url);
}
</script>
</body>
</html>
