<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>피벗 테이블 생성기</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.3.0/exceljs.min.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', 'Malgun Gothic', sans-serif;
    background: #f0f4f8;
    min-height: 100vh;
    padding: 32px 16px;
    color: #1a2332;
  }
  .container { max-width: 960px; margin: 0 auto; }
  header { margin-bottom: 28px; }
  header h1 { font-size: 22px; font-weight: 700; color: #1a2332; letter-spacing: -0.3px; }
  header p  { margin-top: 6px; font-size: 13px; color: #6b7a8d; }

  .card {
    background: #fff;
    border-radius: 14px;
    border: 1px solid #e2e8f0;
    padding: 24px;
    margin-bottom: 16px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.04);
  }
  .card-title {
    font-size: 11px; font-weight: 700; color: #6b7a8d;
    text-transform: uppercase; letter-spacing: 0.7px; margin-bottom: 14px;
  }

  /* 드롭존 */
  .drop-zone {
    border: 1.5px dashed #c5d0de; border-radius: 10px;
    padding: 40px 20px; text-align: center; cursor: pointer;
    transition: all 0.2s; background: #fafbfc;
  }
  .drop-zone:hover, .drop-zone.drag-over { border-color: #3b7bde; background: #f0f5ff; }
  .drop-zone .icon { font-size: 36px; margin-bottom: 10px; }
  .drop-zone p.main { font-size: 15px; font-weight: 600; color: #2d3748; margin-bottom: 4px; }
  .drop-zone p.sub  { font-size: 12px; color: #9aa5b4; }

  /* 설정 그리드 */
  .config-grid { display: grid; grid-template-columns: repeat(4,1fr); gap: 12px; }
  @media(max-width:600px){ .config-grid { grid-template-columns: repeat(2,1fr); } }
  .config-item label {
    display: block; font-size: 11px; font-weight: 600; color: #6b7a8d;
    margin-bottom: 5px; text-transform: uppercase; letter-spacing: 0.4px;
  }
  .config-item select, .config-item input {
    width: 100%; padding: 8px 10px; border: 1px solid #dde3ec;
    border-radius: 7px; font-size: 13px; color: #1a2332; background: #fff;
    outline: none; transition: border-color 0.15s;
  }
  .config-item select:focus, .config-item input:focus { border-color: #3b7bde; }

  /* 버튼 */
  .btn {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 9px 20px; border-radius: 8px; font-size: 13px;
    font-weight: 600; cursor: pointer; border: none; transition: all 0.15s;
  }
  .btn-primary   { background: #3b7bde; color: #fff; }
  .btn-primary:hover { background: #2d6acc; }
  .btn-secondary { background: #f0f4f8; color: #3b7bde; border: 1px solid #c5d0de; }
  .btn-secondary:hover { background: #e2eaf4; }
  .btn-row { display: flex; gap: 10px; align-items: center; margin-top: 14px; flex-wrap: wrap; }

  /* 결과 헤더 */
  .result-header {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 14px; flex-wrap: wrap; gap: 8px;
  }
  .file-badge {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 12px; font-weight: 600; color: #2d7a4f;
    background: #e8f5ee; border-radius: 20px; padding: 4px 12px;
  }
  .stat-badge { font-size: 12px; color: #6b7a8d; }

  /* 피벗 테이블 */
  .table-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }

  table thead th {
    background: #2E5EA8; color: #fff;
    padding: 10px 16px; text-align: center;
    font-weight: 700; white-space: nowrap;
    border: 1px solid #2151a1;
  }

  table tbody tr:nth-child(odd)  td { background: #ffffff; }
  table tbody tr:nth-child(even) td { background: #dce6f1; }
  table tbody tr:hover td { background: #c9d9ee; }

  table tbody td {
    padding: 8px 16px; border: 1px solid #b8c8df;
    text-align: right; color: #1a2332;
  }
  table tbody td:first-child {
    text-align: center; font-weight: 600;
    background: #dce6f1 !important;
  }

  table tfoot td {
    padding: 9px 16px; text-align: right;
    background: #2E5EA8; color: #fff;
    font-weight: 700; border: 1px solid #2151a1;
  }
  table tfoot td:first-child { text-align: center; }

  .hidden { display: none !important; }
</style>
</head>
<body>
<div class="container">

  <header>
    <h1>📊 피벗 테이블 생성기</h1>
    <p>엑셀 파일을 올리면 공장별 · 연도별 수량 합계를 자동으로 만들어줍니다.</p>
  </header>

  <div class="card">
    <div class="card-title">1 · 파일 업로드</div>
    <div class="drop-zone" id="dropZone" onclick="document.getElementById('fileInput').click()">
      <div class="icon">📂</div>
      <p class="main">엑셀 파일을 드래그하거나 클릭해서 업로드</p>
      <p class="sub">.xlsx · .xls 파일 지원</p>
      <input type="file" id="fileInput" accept=".xlsx,.xls" style="display:none">
    </div>
  </div>

  <div class="card hidden" id="configCard">
    <div class="card-title">2 · 열 설정</div>
    <div class="config-grid">
      <div class="config-item">
        <label>공장코드 열</label>
        <select id="colFactory">
          <option value="B">B열</option><option value="A">A열</option>
          <option value="C">C열</option><option value="D">D열</option><option value="E">E열</option>
        </select>
      </div>
      <div class="config-item">
        <label>날짜 열</label>
        <select id="colDate">
          <option value="H">H열</option><option value="E">E열</option>
          <option value="F">F열</option><option value="G">G열</option><option value="I">I열</option>
        </select>
      </div>
      <div class="config-item">
        <label>수량 열</label>
        <select id="colQty">
          <option value="I">I열</option><option value="J">J열</option>
          <option value="K">K열</option><option value="H">H열</option><option value="L">L열</option>
        </select>
      </div>
      <div class="config-item">
        <label>시작 행</label>
        <input type="number" id="startRow" value="6" min="1">
      </div>
    </div>
    <div class="btn-row">
      <button class="btn btn-primary" onclick="buildPivot()">피벗 생성 →</button>
    </div>
  </div>

  <div class="card hidden" id="resultCard">
    <div class="result-header">
      <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;">
        <span class="file-badge" id="fileBadge">✓ 파일명</span>
        <span class="stat-badge" id="statBadge"></span>
      </div>
      <button class="btn btn-secondary" onclick="exportExcel()">⬇ 엑셀로 저장</button>
    </div>
    <div class="table-wrap">
      <table id="pivotTable"></table>
    </div>
  </div>

</div>
<script>
let wb = null;
let pivotCache = null;

const dz = document.getElementById('dropZone');
dz.addEventListener('dragover', e => { e.preventDefault(); dz.classList.add('drag-over'); });
dz.addEventListener('dragleave', () => dz.classList.remove('drag-over'));
dz.addEventListener('drop', e => { e.preventDefault(); dz.classList.remove('drag-over'); loadFile(e.dataTransfer.files[0]); });
document.getElementById('fileInput').addEventListener('change', e => loadFile(e.target.files[0]));

function loadFile(file) {
  if (!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    wb = XLSX.read(e.target.result, { type: 'array' });
    document.getElementById('fileBadge').textContent = '✓ ' + file.name;
    document.getElementById('configCard').classList.remove('hidden');
    buildPivot();
  };
  reader.readAsArrayBuffer(file);
}

function colToIdx(col) {
  col = col.toUpperCase();
  let n = 0;
  for (let i = 0; i < col.length; i++) n = n * 26 + col.charCodeAt(i) - 64;
  return n - 1;
}

function extractYear(val) {
  if (!val && val !== 0) return null;
  if (typeof val === 'number' && val > 10000) {
    const d = new Date(Math.round((val - 25569) * 86400 * 1000));
    const yr = d.getUTCFullYear();
    if (yr > 1990 && yr < 2100) return String(yr);
  }
  const s = String(val).trim();
  const m = s.match(/^(\d{4})[.\-\/]/);
  if (m) return m[1];
  if (/^\d{8}$/.test(s)) return s.slice(0, 4);
  if (/^(19|20)\d{2}/.test(s)) return s.slice(0, 4);
  return null;
}

function buildPivot() {
  if (!wb) return;
  const ws = wb.Sheets[wb.SheetNames[0]];
  const startRow = parseInt(document.getElementById('startRow').value) || 6;
  const fIdx = colToIdx(document.getElementById('colFactory').value);
  const dIdx = colToIdx(document.getElementById('colDate').value);
  const qIdx = colToIdx(document.getElementById('colQty').value);
  const range = XLSX.utils.decode_range(ws['!ref'] || 'A1:Z1000');

  const pivot = {}, factories = new Set(), years = new Set();
  let totalRows = 0, grandSum = 0;

  for (let r = startRow - 1; r <= range.e.r; r++) {
    const fCell = ws[XLSX.utils.encode_cell({r, c: fIdx})];
    const dCell = ws[XLSX.utils.encode_cell({r, c: dIdx})];
    const qCell = ws[XLSX.utils.encode_cell({r, c: qIdx})];
    if (!fCell || !dCell || !qCell) continue;
    const factory = String(fCell.v).trim();
    const year    = extractYear(dCell.v);
    const qty     = parseFloat(qCell.v);
    if (!factory || !year || isNaN(qty)) continue;
    factories.add(factory);
    years.add(year);
    const key = factory + '|' + year;
    pivot[key] = (pivot[key] || 0) + qty;
    grandSum += qty;
    totalRows++;
  }

  const factArr = [...factories].sort();
  const yearArr = [...years].sort();
  pivotCache = { pivot, factArr, yearArr, grandSum };

  // HTML 테이블 렌더링
  const tbl = document.getElementById('pivotTable');
  let html = '<thead><tr><th>공장코드</th>';
  yearArr.forEach(y => html += `<th>${y}</th>`);
  html += '<th>합계</th></tr></thead><tbody>';

  factArr.forEach(f => {
    let rowSum = 0;
    html += `<tr><td>${f}</td>`;
    yearArr.forEach(y => {
      const v = pivot[f + '|' + y] || 0;
      rowSum += v;
      html += v ? `<td>${v.toLocaleString('ko-KR')}</td>`
                : `<td style="color:#ccd4e0;">-</td>`;
    });
    html += `<td><b>${rowSum.toLocaleString('ko-KR')}</b></td></tr>`;
  });

  html += '</tbody><tfoot><tr><td>전체 합계</td>';
  yearArr.forEach(y => {
    const s = factArr.reduce((a, f) => a + (pivot[f + '|' + y] || 0), 0);
    html += `<td>${s.toLocaleString('ko-KR')}</td>`;
  });
  html += `<td>${grandSum.toLocaleString('ko-KR')}</td></tr></tfoot>`;
  tbl.innerHTML = html;

  document.getElementById('statBadge').textContent =
    `공장 ${factArr.length}개 · 연도 ${yearArr.length}개 · ${totalRows.toLocaleString()}행 처리`;
  document.getElementById('resultCard').classList.remove('hidden');
}

async function exportExcel() {
  if (!pivotCache) return;
  const { pivot, factArr, yearArr, grandSum } = pivotCache;

  const workbook  = new ExcelJS.Workbook();
  const sheet     = workbook.addWorksheet('피벗테이블');

  // ── 열 너비 설정 ──
  sheet.getColumn(1).width = 14;
  yearArr.forEach((_, i) => sheet.getColumn(i + 2).width = 14);
  sheet.getColumn(yearArr.length + 2).width = 16;

  // ── 공통 스타일 ──
  const headerFill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FF2E5EA8' } };
  const totalFill  = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FF2E5EA8' } };
  const evenFill   = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FFDCE6F1' } };
  const labelFill  = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FFDCE6F1' } };
  const whiteFill  = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FFFFFFFF' } };
  const thinBorder = {
    top: { style: 'thin', color: { argb: 'FFB8C8DF' } },
    left: { style: 'thin', color: { argb: 'FFB8C8DF' } },
    bottom: { style: 'thin', color: { argb: 'FFB8C8DF' } },
    right: { style: 'thin', color: { argb: 'FFB8C8DF' } },
  };
  const numFmt = '#,##0';

  // ── 1행: 헤더 ──
  const headerRow = sheet.addRow(['공장코드', ...yearArr, '합계']);
  headerRow.eachCell(cell => {
    cell.fill   = headerFill;
    cell.font   = { bold: true, color: { argb: 'FFFFFFFF' }, size: 11 };
    cell.border = { top: { style: 'thin', color: { argb: 'FF2151A1' } }, left: { style: 'thin', color: { argb: 'FF2151A1' } }, bottom: { style: 'thin', color: { argb: 'FF2151A1' } }, right: { style: 'thin', color: { argb: 'FF2151A1' } } };
    cell.alignment = { horizontal: 'center', vertical: 'middle' };
  });

  // ── 데이터 행 ──
  factArr.forEach((f, ri) => {
    let rowSum = 0;
    const rowData = [f];
    yearArr.forEach(y => {
      const v = pivot[f + '|' + y] || 0;
      rowData.push(v || null);
      rowSum += v;
    });
    rowData.push(rowSum);

    const row = sheet.addRow(rowData);
    const isEven = (ri % 2 === 1);

    row.eachCell({ includeEmpty: true }, (cell, colNum) => {
      cell.border = thinBorder;
      if (colNum === 1) {
        cell.fill = labelFill;
        cell.font = { bold: true, size: 11 };
        cell.alignment = { horizontal: 'center', vertical: 'middle' };
      } else {
        cell.fill = isEven ? evenFill : whiteFill;
        cell.alignment = { horizontal: 'right', vertical: 'middle' };
        if (cell.value) cell.numFmt = numFmt;
        if (colNum === yearArr.length + 2) cell.font = { bold: true, size: 11 };
      }
    });
  });

  // ── 합계 행 ──
  const colTotals = ['전체 합계'];
  yearArr.forEach(y => {
    colTotals.push(factArr.reduce((a, f) => a + (pivot[f + '|' + y] || 0), 0));
  });
  colTotals.push(grandSum);

  const totalRow = sheet.addRow(colTotals);
  totalRow.eachCell({ includeEmpty: true }, (cell, colNum) => {
    cell.fill   = totalFill;
    cell.font   = { bold: true, color: { argb: 'FFFFFFFF' }, size: 11 };
    cell.border = { top: { style: 'thin', color: { argb: 'FF2151A1' } }, left: { style: 'thin', color: { argb: 'FF2151A1' } }, bottom: { style: 'thin', color: { argb: 'FF2151A1' } }, right: { style: 'thin', color: { argb: 'FF2151A1' } } };
    if (colNum === 1) {
      cell.alignment = { horizontal: 'center', vertical: 'middle' };
    } else {
      cell.alignment = { horizontal: 'right', vertical: 'middle' };
      if (cell.value) cell.numFmt = numFmt;
    }
  });

  // ── 다운로드 ──
  const buffer = await workbook.xlsx.writeBuffer();
  const blob   = new Blob([buffer], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
  const url    = URL.createObjectURL(blob);
  const a      = document.createElement('a');
  a.href       = url;
  a.download   = '공장별_연도별_피벗.xlsx';
  a.click();
  URL.revokeObjectURL(url);
}
</script>
</body>
</html>
